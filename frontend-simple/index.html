<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sentinel Dashboard</title>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<style>
body{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;font-family:Arial;margin:0;padding:20px}
.navbar{background:rgba(0,0,0,0.3);padding:20px;border-radius:10px;margin-bottom:30px;display:flex;justify-content:space-between}
h1{margin:0}
.status{padding:10px 20px;border-radius:20px;font-weight:bold;background:#22c55e}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
.card{background:rgba(255,255,255,0.9);color:#333;padding:30px;border-radius:12px;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,0.2)}
.card h3{margin:0;color:#666;font-size:14px;text-transform:uppercase}
.number{font-size:48px;font-weight:bold;margin:10px 0 0 0}
.alerts{background:rgba(255,255,255,0.95);color:#333;padding:30px;border-radius:12px;max-height:400px;overflow-y:auto}
.alert{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.badge{padding:5px 10px;border-radius:5px;font-weight:bold;font-size:12px}
.critical{background:#fca5a5;color:#7f1d1d}
.suspicious{background:#fed7aa;color:#92400e}
.normal{background:#bbf7d0;color:#065f46}
</style>
</head>
<body>
<div class="navbar">
<h1>Sentinel Platform</h1>
<div class="status" id="status">Connecting...</div>
</div>
<div class="grid">
<div class="card"><h3>Total Events</h3><div class="number" id="total">--</div></div>
<div class="card" style="border-left:5px solid #dc2626"><h3>Critical</h3><div class="number" id="critical">--</div></div>
<div class="card" style="border-left:5px solid #d97706"><h3>Suspicious</h3><div class="number" id="suspicious">--</div></div>
<div class="card" style="border-left:5px solid #059669"><h3>Normal</h3><div class="number" id="normal">--</div></div>
</div>
<div class="alerts">
<h2>Real-Time Alerts</h2>
<div id="alerts"></div>
</div>
<script>
const token='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJlbWFpbCI6Im1vaGFtbWVkLmFsYWdoYUBjb21wYW55LmNvbSIsInJvbGUiOiJhbmFseXN0IiwiaWF0IjoxNzg0ODM4MzkwLCJleHAiOjE3ODQ5MjQ3OTB9.g0I20znRtTl6eFUhsDaECtd2Vv_GOJm6Kx0tRH0634k';
fetch('http://localhost:5000/api/v1/dashboard/stats',{headers:{'Authorization':`Bearer ${token}`}})
.then(r=>r.json())
.then(d=>{
document.getElementById('total').textContent=d.total_events;
document.getElementById('critical').textContent=d.critical;
document.getElementById('suspicious').textContent=d.suspicious;
document.getElementById('normal').textContent=d.normal;
}).catch(e=>console.error('Error:',e));
const socket=io('http://localhost:5000');
socket.on('connect',()=>{
document.getElementById('status').textContent='Connected';
socket.emit('join_org',{organization_id:'org_001'});
});
socket.on('alert',(data)=>{
const div=document.createElement('div');
div.className='alert';
const badgeClass=['critical','suspicious','normal'].includes(data.status)?data.status:'normal';
div.innerHTML=`<span>${data.message||'Alert'}</span><span class="badge ${badgeClass}">${data.status||'normal'}</span>`;
document.getElementById('alerts').prepend(div);
});
socket.on('disconnect',()=>document.getElementById('status').textContent='Disconnected');
</script>
</body>
</html>
